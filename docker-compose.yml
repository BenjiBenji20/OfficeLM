services:

  api:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Optional: Local LLM via Ollama ──────────────────────────────────────────
  # Activated when LLM_PROVIDER=ollama (default).
  # Run with: docker compose --profile local-llm up
  # Skip with: docker compose up  (when using OpenAI / Gemini remote providers)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    profiles: ["local-llm"]
    # ── GPU Support (opt-in) ──────────────────────────────────────────────────
    # Uncomment the deploy block below if you have an NVIDIA GPU and
    # nvidia-container-toolkit installed. Defaults to CPU if omitted.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Storage (Placeholder) ───────────────────────────────────────────────────
  # Uncomment when object storage is wired in the application.
  # Note: Official MinIO community public images were archived by MinIO.
  # S3-compatible alternatives like SeaweedFS or Garage can be used here.
  # minio:
  #   image: chrislusf/seaweedfs:latest
  #   command: "server -s3"
  #   ports:
  #     - "9000:9000"
  #   volumes:
  #     - miniodata:/data

  # ── Qdrant Vector DB ─────────────────────────────────────────────────────────
  # Uncomment when the RAG pipeline is implemented.
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrantdata:/qdrant/storage

  # ── Future: Frontend ─────────────────────────────────────────────────────────
  # frontend:
  #   build: ../frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api

