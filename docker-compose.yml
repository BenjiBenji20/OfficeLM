services:

  api:
    build: .
    env_file:
      - secrets.env
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379/0
      - OLLAMA_BASE_URL=http://localhost:11434
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    network_mode: host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    network_mode: host
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Optional: Local LLM via Ollama ──────────────────────────────────────────
  # Activated when LLM_PROVIDER=ollama (default).
  # Run with: docker compose --profile local-llm up
  # Skip with: docker compose up  (when using OpenAI / Gemini remote providers)
  ollama:
    image: ollama/ollama:latest
    network_mode: host
    volumes:
      - ollamadata:/root/.ollama
    profiles: ["local-llm"]

  # ── Storage (Placeholder) ───────────────────────────────────────────────────
