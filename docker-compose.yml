services:

  api:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_STAGING_USER}:${POSTGRES_STAGING_PASSWORD}@postgres:5432/${POSTGRES_STAGING_DB}
      - REDIS_URL=redis://:${REDIS_STAGING_PASSWORD}@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_STAGING_DB}
      POSTGRES_USER: ${POSTGRES_STAGING_USER}
      POSTGRES_PASSWORD: ${POSTGRES_STAGING_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_STAGING_USER} -d $${POSTGRES_STAGING_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_STAGING_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_STAGING_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector DB (Placeholder) ──────────────────────────────
  # Uncomment when Qdrant vector search is enabled
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrantdata:/qdrant/storage

  # ── Optional Profile-Gated Services ─────────────────────────────
  # Run with `docker compose --profile local-llm up`
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    profiles: ["local-llm"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - miniodata:/data
    profiles: ["local-llm"]

volumes:
  pgdata:
  redisdata:
  # qdrantdata:
  ollamadata:
  miniodata: